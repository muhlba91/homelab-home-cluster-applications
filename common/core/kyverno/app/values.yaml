---
grafana:
  enabled: true

admissionController:
  rbac: &extraRbacResources
    clusterRole:
      extraResources:
        - apiGroups:
            - gateway.networking.k8s.io
          resources:
            - httproutes
            - listenersets
          verbs:
            - get
            - list
            - watch
  container:
    resources:
      requests:
        cpu: 9m
        memory: 128Mi
      limits:
        memory: 128Mi

backgroundController:
  rbac: *extraRbacResources
  resources:
    requests:
      cpu: 5m
      memory: 384Mi
    limits:
      memory: 1024Mi

cleanupController:
  rbac: *extraRbacResources
  resources:
    requests:
      cpu: 10m
      memory: 58Mi
    limits:
      memory: 58Mi

reportsController:
  rbac: *extraRbacResources
  resources:
    requests:
      cpu: 4m
      memory: 103Mi
    limits:
      memory: 103Mi
