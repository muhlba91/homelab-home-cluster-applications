---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-5.0.0/charts/library/common/values.schema.json
global:
  alwaysAppendIdentifierToResourceName: true

defaultPodOptions:
  restartPolicy: Never
  automountServiceAccountToken: true

controllers:
  main:
    type: cronjob
    serviceAccount:
      identifier: krr
    cronjob:
      schedule: 0 6 * * *
      successfulJobsHistory: 3
      failedJobsHistory: 1
      concurrencyPolicy: Forbid
    containers:
      krr:
        image:
          repository: robustadev/krr
          tag: v1.29.0
        command:
          - /bin/sh
          - -c
          - >-
            python krr.py simple --max-workers 3 --width 2048 --cpu-min 3 --mem-min 8
            --logtostderr -f json
            | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)))"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 2048Mi

serviceAccount:
  krr:
    enabled: true

rbac:
  roles:
    krr:
      enabled: true
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources:
            - configmaps
            - namespaces
            - pods
            - replicationcontrollers
            - services
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources:
            - nodes
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            - daemonsets
            - deployments
            - deployments/scale
            - replicasets
            - replicasets/scale
            - statefulsets
          verbs: ["get", "list", "watch"]
        - apiGroups: ["extensions"]
          resources:
            - daemonsets
            - deployments
            - deployments/scale
            - ingresses
            - replicasets
            - replicasets/scale
            - replicationcontrollers/scale
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources:
            - cronjobs
            - jobs
          verbs: ["get", "list", "watch"]
        - apiGroups: ["autoscaling"]
          resources:
            - horizontalpodautoscalers
          verbs: ["get", "list", "watch"]
  bindings:
    krr:
      enabled: true
      type: ClusterRoleBinding
      roleRef:
        kind: ClusterRole
        identifier: krr
      subjects:
        - identifier: krr
