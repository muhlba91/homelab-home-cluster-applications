---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-rules-exceptions
  namespace: falco
spec:
  inlineRules:
    - rule: Drop and execute new binary in container
      exceptions:
        - name: cilium_cni_binary_install
          fields: [proc.name, proc.exepath]
          comps: [=, =]
          values:
            - - cilium-cni
              - /opt/cni/bin/cilium-cni
        - name: homeassistant_backup_and_sops
          fields: [container.image.repository, container.name, k8s.ns.name]
          comps: [=, =, startswith]
          values:
            - - docker.io/library/alpine
              - backup
              - home-assistant-
            - - docker.io/library/python
              - backup
              - home-assistant-
            - - ghcr.io/home-assistant/home-assistant
              - home-assistant
              - home-assistant-
      override:
        exceptions: append
    - rule: Fileless execution via memfd_create
      exceptions:
        - name: nvidia_ctk_ldconfig_hook
          fields: [proc.pname, proc.exepath]
          comps: [=, startswith]
          values:
            - [nvidia-ctk, "memfd:runc_cloned:/run/nvidia-ctk-hook/"]
      override:
        exceptions: append
  priority: 51
