kind: Component
metadata:
  name: metacollector
spec:
  component:
    type: metacollector
  replicas: 1
  podTemplateSpec:
    spec:
      containers:
        - name: metacollector
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
