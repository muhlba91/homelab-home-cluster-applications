---
# headerModifiers (Envoy's native response header mutation), not a transformation: kgateway's
# transformation filter buffers every response body until it ends (also for header-only rules),
# which rejects large downloads and holds back streamed responses.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: global-hsts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kgateway-gateway
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kgateway-gateway-internal
  headerModifiers:
    response:
      set:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
