---
operatorConfig:
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
      replicas: 1

drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    controllerPlugin:
      priorityClassName: system-cluster-critical
      resources:
        attacher:
          requests:
            cpu: 5m
            memory: 50Mi
          limits:
            memory: 64Mi
        omapGenerator:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        plugin:
          requests:
            cpu: 3m
            memory: 98Mi
          limits:
            memory: 98Mi
        provisioner:
          requests:
            cpu: 4m
            memory: 49Mi
          limits:
            memory: 64Mi
        resizer:
          requests:
            cpu: 4m
            memory: 43Mi
          limits:
            memory: 64Mi
        snapshotter:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi
        addons: {}
        liveness: {}
        logRotator:
          requests:
            cpu: 3m
            memory: 8Mi
          limits:
            memory: 16Mi
    nodePlugin:
      priorityClassName: system-cluster-critical
      resources:
        plugin:
          requests:
            cpu: 3m
            memory: 70Mi
          limits:
            memory: 96Mi
        registrar:
          requests:
            cpu: 3m
            memory: 9Mi
          limits:
            memory: 16Mi
        addons: {}
        liveness: {}
        logRotator:
          requests:
            cpu: 3m
            memory: 8Mi
          limits:
            memory: 16Mi

  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    controllerPlugin:
      resources:
        attacher:
          requests:
            cpu: 3m
            memory: 52Mi
          limits:
            memory: 64Mi
        plugin:
          requests:
            cpu: 3m
            memory: 24Mi
          limits:
            memory: 32Mi
        provisioner:
          requests:
            cpu: 4m
            memory: 50Mi
          limits:
            memory: 64Mi
        resizer:
          requests:
            cpu: 3m
            memory: 57Mi
          limits:
            memory: 64Mi
        snapshotter:
          requests:
            cpu: 3m
            memory: 68Mi
          limits:
            memory: 68Mi
        omapGenerator: {}
        addons: {}
        liveness: {}
        logRotator:
          requests:
            cpu: 3m
            memory: 8Mi
          limits:
            memory: 16Mi
    nodePlugin:
      resources:
        plugin:
          requests:
            cpu: 3m
            memory: 24Mi
          limits:
            memory: 32Mi
        registrar:
          requests:
            cpu: 3m
            memory: 9Mi
          limits:
            memory: 16Mi
        addons: {}
        liveness: {}
        logRotator:
          requests:
            cpu: 3m
            memory: 8Mi
          limits:
            memory: 16Mi

  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
