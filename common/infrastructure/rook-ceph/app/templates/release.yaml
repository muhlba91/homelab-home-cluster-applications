---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APPLICATION}
  namespace: flux-system
  annotations:
    # guardrail: removing this from Git orphans it instead of deleting its data
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  releaseName: ${APPLICATION}
  targetNamespace: ${APPLICATION_NAMESPACE}
  interval: 10m
  maxHistory: 3
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  rollback:
    recreate: true
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.8
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: ${APPLICATION}-values
      valuesKey: values.yaml
