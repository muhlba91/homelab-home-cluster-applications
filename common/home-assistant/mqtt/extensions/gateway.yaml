---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: emqx-dashboard-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${INTERNAL_CLUSTER_ISSUER}"
spec:
  parentRef:
    name: kgateway-gateway-internal
    namespace: kgateway
  listeners:
    - name: https-emqx-dashboard
      protocol: HTTPS
      port: 443
      hostname: emqx.iot.${LOCAL_INTERNAL_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: home-assistant-emqx-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emqx-dashboard
  annotations:
    external-dns.kubernetes.io/provider: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: MQTT Broker
    gethomepage.dev/group: Smart Home
    gethomepage.dev/icon: emqx
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=emqx"
    gethomepage.dev/description: Message broker for smart home devices
    # hardcoded: Flux substitution of numeric values into raw manifests loses
    # YAML string quoting during the kustomize build step, breaking typed-patch
    # apply (annotations must stay strings) - keep in sync with
    # LANDING_PAGE_INTERNAL_WEIGHT in cluster-configuration.yaml
    gethomepage.dev/weight: "100"
spec:
  parentRefs:
    - name: emqx-dashboard-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - emqx.iot.${LOCAL_INTERNAL_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: emqx
          port: 18083
