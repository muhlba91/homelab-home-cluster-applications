---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zwave-js-scripts
data:
  backup_restore.sh: |
    #!/bin/sh
    set -euo pipefail

    apk add --no-cache jq curl

    #region global configuration
    URL="http://home-assistant-zwave-zwave-js:8091/api"
    S3_ASSETS_BUCKET_BACKUP_PATH="$${S3_ASSETS_BUCKET}/$${S3_ASSETS_BUCKET_PATH}/zwave"
    #endregion

    #region functions
    function restart() {
      echo "application will be restarted..."

      kubectl -n home-assistant-zwave delete pod -l app.kubernetes.io/name=home-assistant-zwave

      echo "application restarted."
    }

    function backup() {
      echo "backing up..."

      # download backup
      token=$(curl -fsS -X POST $${URL}/authenticate -d "{ \"username\": \"$${ZWAVE_USERNAME}\", \"password\": \"$${ZWAVE_PASSWORD}\" }" -H "Content-Type: application/json" | jq -c '.user.token' -r)
      if [[ -z "$${token}" || "$${token}" == "null" ]]; then
        echo "backup error: authentication failed."
        exit 1
      fi
      rm -f backup.zip
      curl -fsS $${URL}/store/backup -H "Authorization: Bearer $${token}" -H "Accept: application/json" -o backup.zip

      # never overwrite the last good backup in S3 with an error body or an empty archive
      if ! unzip -l backup.zip > /dev/null 2>&1; then
        echo "backup error: downloaded backup.zip is not a valid archive; keeping the previous backup."
        exit 1
      fi
      entries=$(unzip -l backup.zip | tail -n 1 | awk '{print $$2}')
      if ! [ "$${entries}" -ge 1 ] 2> /dev/null; then
        echo "backup error: downloaded backup.zip is empty; keeping the previous backup."
        exit 1
      fi

      # upload backup to S3
      s3cmd --access_key=$${SCW_ACCESS_KEY} --secret_key="$${SCW_SECRET_KEY}" --host="https://s3.$${SCW_DEFAULT_REGION}.scw.cloud" --host-bucket="https://%(bucket)s.s3.$${SCW_DEFAULT_REGION}.scw.cloud" sync backup.zip s3://$${S3_ASSETS_BUCKET_BACKUP_PATH}/

      echo "backed up and uploaded to s3://$${S3_ASSETS_BUCKET_BACKUP_PATH}/backup.zip."
    }

    function restore() {
      echo "restoring from s3://$${S3_ASSETS_BUCKET_BACKUP_PATH}/backup.zip..."

      # download backup from S3
      s3cmd --access_key=$${SCW_ACCESS_KEY} --secret_key="$${SCW_SECRET_KEY}" --host="https://s3.$${SCW_DEFAULT_REGION}.scw.cloud" --host-bucket="https://%(bucket)s.s3.$${SCW_DEFAULT_REGION}.scw.cloud" --recursive --force get s3://$${S3_ASSETS_BUCKET_BACKUP_PATH}/backup.zip ./

      # restore backup
      restore=$(curl -s -X POST $${URL}/store/upload -F "restore=true" -F "upload=@backup.zip" -H "Accept: application/json" -H "Content-Type: multipart/form-data")
      if [[ `echo $${restore} | jq -c '.success' -r` == "true" ]]; then
        echo "restore successful."
        # ATTENTION: the application MUST be restarted afterwards to load the new configuration!
        restart
      else
        echo "restore error: `echo $${restore} | jq -c '.message' -r`"
        exit 1
      fi
    }
    #endregion

    #region install packages
    apk --no-cache add jq curl s3cmd
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    #endregion

    #region log configuration
    echo "using endpoint: $${URL}"
    echo "using S3 bucket and path: $${S3_ASSETS_BUCKET_BACKUP_PATH}"
    #endregion

    #region wait for API readiness
    echo "waiting for API readiness..."
    while [[ ! `curl -s $${URL}/auth-enabled -H "Accept: application/json"` ]]; do
      sleep 1
    done
    echo "API is ready."
    #endregion

    #region authentication check
    auth_enabled=$(curl -s $${URL}/auth-enabled -H "Accept: application/json" | jq -c '.data' -r)
    echo "detected authentication: $${auth_enabled}"
    #endregion

    #region backup or restore
    # if authentication is enabled, we need to perform a backup
    # otherwise, we have a new (empty) setup and can restore
    if [[ "$${auth_enabled}" == "true" ]]; then
      backup
    else
      restore
    fi
    #endregion
