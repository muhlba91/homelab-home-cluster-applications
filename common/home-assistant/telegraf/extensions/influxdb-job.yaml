---
apiVersion: batch/v1
kind: Job
metadata:
  name: influxdb-init
  annotations:
    # recreate (= re-run) the Job when an immutable field such as the image changes
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 5
  template:
    spec:
      automountServiceAccountToken: true
      serviceAccountName: home-assistant-telegraf
      restartPolicy: OnFailure
      containers:
        - name: influxdb
          image: influxdb:2.9.1
          imagePullPolicy: IfNotPresent
          command:
            - /scripts/influxdb.sh
          envFrom:
            - secretRef:
                name: influxdb-auth
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: telegraf-scripts
            defaultMode: 511
