---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: omada-controller-backend-policy
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: omada-controller-web
  tls:
    insecureSkipVerify: true

---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: omada-controller-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${PUBLIC_CLUSTER_ISSUER}"
spec:
  parentRef:
    name: kgateway-gateway
    namespace: kgateway
  listeners:
    - name: https-omada-controller
      protocol: HTTPS
      port: 443
      hostname: omada.network.${LOCAL_PUBLIC_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: omada-controller-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omada-controller
  annotations:
    external-dns.kubernetes.io/provider: public
    external-dns.kubernetes.io/target: "${PUBLIC_IP}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Omada Controller
    gethomepage.dev/group: Network
    gethomepage.dev/icon: omada
    gethomepage.dev/description: WiFi management
    # hardcoded: Flux substitution of numeric values into raw manifests loses
    # YAML string quoting during the kustomize build step, breaking typed-patch
    # apply (annotations must stay strings) - keep in sync with
    # LANDING_PAGE_PUBLIC_WEIGHT in cluster-configuration.yaml
    gethomepage.dev/weight: "10"
spec:
  parentRefs:
    - name: omada-controller-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - omada.network.${LOCAL_PUBLIC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omada-controller-web
          port: 80
