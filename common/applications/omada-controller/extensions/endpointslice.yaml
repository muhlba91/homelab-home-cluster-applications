---
# backend of the selector-less Service omada-controller-web: the controller's own LoadBalancer IP
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: omada-controller-web-ipv4
  labels:
    kubernetes.io/service-name: omada-controller-web
    endpointslice.kubernetes.io/managed-by: fluxcd
addressType: IPv4
ports:
  - name: http
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - ${OMADA_CONTROLLER_IPV4}
    conditions:
      ready: true

