---
updateStrategy:
  type: Recreate

expose:
  type: clusterIP
  tls:
    auto:
      commonName: registry.${PUBLIC_DOMAIN}

externalURL: https://registry.${PUBLIC_DOMAIN}

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: ${DEFAULT_STORAGE_CLASS}
      size: 10Gi
    jobservice:
      jobLog:
        storageClass: ${DEFAULT_STORAGE_CLASS}
        size: 5Gi
    database:
      storageClass: ${DEFAULT_STORAGE_CLASS}
      size: 5Gi
    redis:
      storageClass: ${DEFAULT_STORAGE_CLASS}
      size: 5Gi
    trivy:
      storageClass: ${DEFAULT_STORAGE_CLASS}
      size: 10Gi
  imageChartStorage:
    type: s3
    s3:
      region: fr-par
      regionendpoint: https://s3.fr-par.scw.cloud
      rootdirectory: /harbor
      bucket: scaleway-bucket-home-cluster-hochschule-burgenland-reg-ca4535c # TODO: this bucket must be changed
      existingSecret: scaleway-credentials

existingSecretAdminPassword: admin-password

logLevel: warning
metrics:
  enabled: true

cache:
  enabled: true
  expireHours: 24

existingSecretSecretKey: harbor-secrets

core:
  existingSecret: harbor-secrets
  existingXsrfSecret: harbor-secrets

jobservice:
  existingSecret: harbor-secrets

registry:
  existingSecret: harbor-secrets
  credentials:
    username: harbor_registry_user
    htpasswdString: "harbor_registry_user:$2y$10$6d9gCdug96wcS4mDeJLlR.XaEcHC2X7XpHBRFhyBhxd7noMbgDVRy"

trivy:
  severity: "LOW,MEDIUM,HIGH,CRITICAL"
