---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-5.0.0/charts/library/common/values.schema.json
global:
  alwaysAppendIdentifierToResourceName: true

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      homer:
        image:
          repository: b4bz/homer
          pullPolicy: IfNotPresent
          tag: v26.08.3

        resources:
          requests:
            cpu: 3m
            memory: 64Mi
          limits:
            memory: 128Mi

        probes:
          liveness: &server_probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 30
              timeoutSeconds: 1
              failureThreshold: 5
          readiness: *server_probes
          startup:
            enabled: false

service:
  ${APPLICATION}:
    controller: main
    annotations:
      gatus.home-operations.com/enabled: "true"
    ipFamilyPolicy: PreferDualStack
    ports:
      http:
        port: 8080

route:
  ${APPLICATION}:
    enabled: true
    kind: HTTPRoute
    annotations:
      external-dns.kubernetes.io/provider: "${EXTERNAL_DNS_PROVIDER}"
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: ListenerSet
        namespace: ${APPLICATION_NAMESPACE}
        name: ${APPLICATION}-listeners
    hostnames:
      - &domain landing.${PARENT_DOMAIN}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: ${APPLICATION}
            port: 8080
rawResources:
  listeners:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: ListenerSet
      metadata:
        annotations:
          cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
      spec:
        parentRef:
          name: ${GATEWAY_NAME}
          namespace: kgateway
        listeners:
          - name: https-${APPLICATION}
            protocol: HTTPS
            port: 443
            hostname: *domain
            tls:
              mode: Terminate
              certificateRefs:
                - name: ${APPLICATION}-tls-cert

persistence:
  config:
    enabled: true
    type: configMap
    name: ${APPLICATION}-config
    globalMounts:
      - path: /www/assets/config.yml
        subPath: config.yml
