---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APPLICATION}-target-values
  namespace: flux-system
data:
  values.yaml: |
    ---
    route:
      ${APPLICATION}:
        annotations:
          # internal IPs are not deterministic, so no target is pinned here
          # (contrast with landing-page-external-target-values, where
          # PUBLIC_IP is static and safe to pin).
          external-dns.kubernetes.io/target: ""
