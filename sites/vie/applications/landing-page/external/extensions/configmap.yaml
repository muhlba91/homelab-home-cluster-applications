---
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page-external-config
data:
  config.yml: |
    ---
    title: Tuxnet Services
    subtitle: Landing Page
    icon: fas fa-house-chimney

    theme: default

    header: true
    footer: ""

    columns: 3
    connectivityCheck: true

    defaults:
      layout: columns
      colorTheme: auto
      iconWidth: auto

    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    message: {}

    # links: [] # Allows for navbar (dark mode, layout, and search) without any links
    links:
      - name: Landing Page
        icon: fas fa-house
        url: "/"
      - name: Internal Services
        icon: fas fa-wifi
        url: https://landing.${LOCAL_INTERNAL_DOMAIN}
        target: _blank
      - name: Documentation
        icon: fas fa-book
        url: https://muhlba91.github.io/homelab-documentation/
        target: _blank

    updateIntervalMs: 300000

    services:
      - name: Lifestyle & Productivity
        icon: fa-solid fa-house-user
        items:
          - name: LibreChat
            icon: fa-solid fa-comments
            # type: Ping
            subtitle: Self-hosted AI chat assistant
            tag: ai
            keywords: ai chat
            url: https://chat.ai.home.muehlbachler.io
            target: _blank
          - name: Home Assistant
            icon: fa-solid fa-house-signal
            # type: Ping
            subtitle: Smart home control
            tag: smart-home
            keywords: smart home
            url: https://jarvis.vie.home.muehlbachler.io
            target: _blank
          - name: Immich
            icon: fa-solid fa-images
            # type: Ping
            subtitle: Photo & video library
            tag: photos
            keywords: photos videos backup
            url: https://photos.home.muehlbachler.io
            target: _blank
          - name: Mealie
            icon: fa-solid fa-utensils
            # type: Ping
            subtitle: Recipe manager
            tag: recipes
            keywords: recipes cooking food meal
            url: https://recipes.home.muehlbachler.io
            target: _blank
          - name: Webmail
            icon: fa-solid fa-envelope
            # type: Ping
            subtitle: Access your email inbox
            tag: mail
            keywords: email inbox webmail mail
            url: https://mail.muehlbachler.io
            target: _blank
          - name: SimpleLogin
            icon: fa-solid fa-at
            # type: Ping
            subtitle: Manage private email aliases
            tag: mail
            keywords: email aliases privacy anti-spam
            url: https://aliases.email.muehlbachler.io
            target: _blank

      - name: Monitoring
        icon: fa-solid fa-gauge-high
        items:
          - name: Gatus
            icon: fa-solid fa-heart-pulse
            # type: Ping
            subtitle: Live status page for all services
            tag: monitoring
            keywords: status uptime health monitoring
            url: https://status.vie.home.muehlbachler.io
            target: _blank

      - name: Administration
        icon: fa-solid fa-server
        items:
          - name: Zitadel
            icon: fa-solid fa-id-badge
            # type: Ping
            subtitle: Identity provider / single sign-on
            tag: security
            keywords: identity sso authentication oidc
            url: https://muehlbachler-mhvy5g.zitadel.cloud
            target: _blank
          - name: LiteLLM Proxy
            icon: fa-solid fa-plug
            # type: Ping
            subtitle: Unified API gateway for multiple LLM providers
            tag: ai
            keywords: ai
            url: https://proxy.ai.home.muehlbachler.io
            target: _blank
