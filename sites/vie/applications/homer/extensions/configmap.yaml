---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
data:
  config.yml: |
    ---
    title: Tuxnet Services
    subtitle: Landing Page
    icon: fas fa-house

    theme: default

    header: true
    footer: ""

    columns: 3
    connectivityCheck: true

    defaults:
      layout: columns
      colorTheme: auto
      iconWidth: auto

    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    message: {}

    # links: [] # Allows for navbar (dark mode, layout, and search) without any links
    links:
      - name: Landing Page
        icon: fas fa-house
        url: "/"
      - name: Documentation
        icon: fas fa-book
        url: https://muhlba91.github.io/homelab-documentation/
        target: _blank

    updateIntervalMs: 300000

    services:
      - name: Lifestyle & Productivity
        icon: fa-solid fa-house-user
        items:
          - name: LibreChat
            icon: fa-solid fa-comments
            subtitle: Self-hosted AI chat assistant
            tag: ai
            keywords: ai chat
            url: https://chat.ai.home.muehlbachler.io
            target: _blank
          - name: Home Assistant
            icon: fa-solid fa-house-signal
            subtitle: Smart home control - lights, sensors & automations
            tag: smart-home
            keywords: smart home
            url: https://jarvis.vie.home.muehlbachler.io
            target: _blank
          - name: Immich
            icon: fa-solid fa-images
            subtitle: Photo & video library
            tag: photos
            keywords: photos videos backup
            url: https://photos.home.muehlbachler.io
            target: _blank
          - name: Mealie
            icon: fa-solid fa-utensils
            subtitle: Recipe manager
            tag: recipes
            keywords: recipes cooking food meal
            url: https://recipes.home.muehlbachler.io
            target: _blank
          - name: Webmail
            icon: fa-solid fa-envelope
            subtitle: Access your email inbox
            tag: mail
            keywords: email inbox webmail mail
            url: https://mail.muehlbachler.io
            target: _blank
          - name: SimpleLogin
            icon: fa-solid fa-at
            subtitle: Manage private email aliases
            tag: mail
            keywords: email aliases privacy anti-spam
            url: https://aliases.email.muehlbachler.io
            target: _blank

      - name: Monitoring
        icon: fa-solid fa-gauge-high
        items:
          - name: Gatus
            icon: fa-solid fa-heart-pulse
            subtitle: Live status page for all services
            tag: monitoring
            keywords: status uptime health monitoring
            url: https://status.vie.home.muehlbachler.io
            target: _blank
          - name: Grafana
            icon: fa-solid fa-chart-line
            subtitle: Metrics & dashboards
            tag: monitoring
            keywords: metrics dashboards monitoring
            url: https://grafana.vie.home.muehlbachler.io
            target: _blank

      - name: Smart Home Management
        icon: fa-solid fa-house-signal
        items:
          - name: EMQX
            icon: fa-solid fa-network-wired
            subtitle: MQTT broker powering IoT device messaging
            tag: smart-home
            keywords: mqtt broker iot smart home
            url: https://emqx.iot.vie.internal.muehlbachler.io
            target: _blank
          - name: Node-RED
            icon: fa-solid fa-diagram-project
            subtitle: Visual automation flows for smart home devices
            tag: smart-home
            keywords: automation iot smart home
            url: https://node-red.iot.vie.internal.muehlbachler.io
            target: _blank
          - name: Z-Wave JS UI
            icon: fa-solid fa-wave-square
            subtitle: Manage Z-Wave smart home devices
            tag: smart-home
            keywords: zwave z-wave smart home
            url: https://zwave.iot.vie.internal.muehlbachler.io
            target: _blank

      - name: Network
        icon: fa-solid fa-network-wired
        items:
          - name: AdGuard Home
            icon: fa-solid fa-shield-halved
            subtitle: Network-wide ad & tracker blocking
            tag: network
            keywords: dns ad-blocker privacy
            url: https://adguard.vie.internal.muehlbachler.io
            target: _blank
          - name: Omada Controller
            icon: fa-solid fa-wifi
            subtitle: Manage Wi-Fi access points & network
            tag: network
            keywords: wifi tp-link omada
            url: https://omada.network.vie.home.muehlbachler.io
            target: _blank
          - name: Router
            icon: fa-solid fa-router
            subtitle: Router admin console
            tag: network
            keywords: router gateway
            url: https://10.0.0.1
            target: _blank
          - name: Switch 1 (Tech Hub)
            icon: fa-solid fa-ethernet
            subtitle: Network switch admin console
            tag: network
            keywords: switch
            url: http://10.0.10.1
            target: _blank
          - name: Switch 2 (Office)
            icon: fa-solid fa-ethernet
            subtitle: Network switch admin console
            tag: network
            keywords: switch
            url: http://10.0.10.1
            target: _blank

      - name: Infrastructure
        icon: fa-solid fa-server
        items:
          - name: Vault
            icon: fa-solid fa-key
            subtitle: Secrets management
            tag: security
            keywords: secrets vault
            url: https://vault.platform.muehlbachler.io:8200
            target: _blank
          - name: Zitadel
            icon: fa-solid fa-id-badge
            subtitle: Identity provider / single sign-on
            tag: security
            keywords: identity sso authentication oidc
            url: https://muehlbachler-mhvy5g.zitadel.cloud
            target: _blank
          - name: VPN Management
            icon: fa-solid fa-lock
            subtitle: Manage VPN access
            tag: vpn
            keywords: vpn wireguard
            url: https://vpn.platform.muehlbachler.io
            target: _blank
          - name: LiteLLM Proxy
            icon: fa-solid fa-plug
            subtitle: Unified API gateway for multiple LLM providers - generate API keys
            tag: ai
            keywords: ai
            url: https://proxy.ai.home.muehlbachler.io
            target: _blank
