---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgresql
  annotations:
    # guardrail: removing this from Git orphans it instead of deleting its data
    kustomize.toolkit.fluxcd.io/prune: disabled
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1

  # renovate: datasource=docker packageName=ghcr.io/cloudnative-pg/postgresql versioning=regex:^(?<major>\d+)\.(?<minor>\d+)-minimal-trixie$
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-minimal-trixie

  storage:
    size: 30Gi
    storageClass: ${DEFAULT_STORAGE_CLASS}

  stopDelay: 300
  smartShutdownTimeout: 60

  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 1024Mi

  enableSuperuserAccess: true
  managed:
    roles:
      - name: immich
        ensure: present
        comment: Immich
        login: true
        superuser: true
        passwordSecret:
          name: immich-database

  bootstrap:
    # initdb:
    #   database: immich
    #   owner: immich
    #   encoding: UTF8
    #   secret:
    #     name: immich-database
    recovery:
      source: immich-postgresql-backup
      database: immich
      owner: immich
      secret:
        name: immich-database

  postgresql:
    shared_preload_libraries:
      - vchord
    extensions:
      - name: pgvector
        image:
          # renovate: datasource=docker packageName=ghcr.io/cloudnative-pg/pgvector versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-18-trixie$
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie
      - name: vchord
        image:
          # renovate: datasource=docker packageName=ghcr.io/muhlba91/postgresql-vchord-extension versioning=regex:^\d+\.\d+\.\d+-18-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          reference: ghcr.io/muhlba91/postgresql-vchord-extension:1.5.0-18-v1.1.0

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgresql-scaleway
        serverName: postgresql

  externalClusters:
    - name: immich-postgresql-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-postgresql-scaleway
          serverName: postgresql
