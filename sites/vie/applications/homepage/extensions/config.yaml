---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |-
    instanceName: internal
    title: Tuxnet

    language: en

    theme: dark
    color: slate
    iconStyle: gradient
    fullWidth: false
    useEqualHeights: true
    headerStyle: clean

    target: _blank

    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: false
      hideVisitURL: true
      provider: google

    hideVersion: true
    disableUpdateCheck: true
    disableIndexing: true

    layout:
      Lifestyle & Productivity:
        style: row
        columns: 4
      Smart Home Management:
        style: row
        columns: 3
      Network:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 3
  services.yaml: ""
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: true
    - openmeteo:
        label: Theresienfeld
        latitude: 47.85
        longitude: 16.23333
        timezone: Europe/Vienna
        units: metric
        cache: 30
  bookmarks.yaml: ""
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
