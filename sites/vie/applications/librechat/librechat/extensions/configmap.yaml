---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
data:
  librechat.yaml: |
    version: 1.3.15
    cache: true

    fileStrategy: s3

    fileConfig:
      endpoints:
        default:
          fileSizeLimit: 10
          totalSizeLimit: 100
      serverFileSizeLimit: 100
      avatarSizeLimit: 4

    rateLimits:
      fileUploads:
        ipMax: 100
        ipWindowInMinutes: 60
        userMax: 50
        userWindowInMinutes: 60

    registration:
      socialLogins:
        - openid
      allowedDomains:
        - "muehlbachler.io"

    interface:
      prompts:
        use: true
        create: true
        share: true
      agents:
        use: true
        create: true
        share: true
      temporaryChatRetention: 168
      retentionMode: all
      retainAgentFiles: true
      contextCost: true
      marketplace:
        use: true

    transactions:
      enabled: true

    memory:
      disabled: true

    summarization:
      provider: Google Gemini
      model: gemini-flash-lite-latest
      maxSummaryTokens: 4096
      reserveRatio: 0.1
      trigger:
        type: token_ratio
        value: 0.8
      contextPruning:
        enabled: true
        keepLastAssistants: 3
        softTrimRatio: 0.3
        hardClearRatio: 0.5
        minPrunableToolChars: 50000
        softTrim:
          maxChars: 4000
          headChars: 1500
          tailChars: 1500
        hardClear:
          enabled: true
          placeholder: "[Old tool result content cleared]"

    ocr:
      mistralModel: mistral-ocr-latest
      baseURL: http://litellm.litellm:4000/v1
      apiKey: "$${LITELLM_API_KEY}"
      strategy: mistral_ocr
      allowedAddresses:
        - "litellm.litellm:4000"

    webSearch:
      searchProvider: serper
      serperApiKey: "$${SERPER_API_KEY}"
      rerankerType: jina
      jinaApiKey: "$${JINA_API_KEY}"
      safeSearch: 0

    endpoints:
      agents:
        recursionLimit: 50
        maxRecursionLimit: 100
        disableBuilder: false
        maxCitations: 30
        maxCitationsPerFile: 7
        minRelevanceScore: 0.45
        activityLabel: true
        activityEndpoint: Google Gemini
        activityModel: gemini-flash-lite-latest
        activityPhaseLabel: true
        toolApproval:
          enabled: true
          mode: default
          deny:
            - "mcp:*:delete_*"
          ask:
            - "mcp:*:write_*"
            - "mcp:*:delete_*"

      custom:
        - name: Anthropic Claude
          provider: anthropic
          apiKey: user_provided
          baseURL: http://litellm.litellm:4000
          headers:
            anthropic-version: "2023-06-01"
          iconURL: anthropic
          titleConvo: true
          titleEndpoint: Google Gemini
          titleModel: gemini-flash-lite-latest
          titleMethod: completion
          models:
            default:
              - claude-haiku-4-5
              - claude-sonnet-4-6
              - claude-sonnet-4-8
              - claude-sonnet-5
              - claude-opus-4-8
              - claude-opus-5
            fetch: false

        - name: Google Gemini
          apiKey: user_provided
          baseURL: http://litellm.litellm:4000/v1
          iconURL: google
          titleConvo: true
          titleEndpoint: Google Gemini
          titleModel: gemini-flash-lite-latest
          titleMethod: completion
          models:
            default:
              - gemini-flash-lite-latest
              - gemini-3.8-flash
              - gemini-3.7-flash
              - gemini-3.1-pro-preview
              - gemini-embedding-2-preview
            fetch: false

        - name: OpenAI GPT
          apiKey: user_provided
          baseURL: http://litellm.litellm:4000/v1
          iconURL: openAI
          titleConvo: true
          titleEndpoint: Google Gemini
          titleModel: gemini-flash-lite-latest
          titleMethod: completion
          models:
            default:
              - gpt-5.4-nano
              - gpt-5.4-mini
              - gpt-5.6
            fetch: false

        - name: Mistral
          apiKey: user_provided
          baseURL: http://litellm.litellm:4000/v1
          titleConvo: true
          titleEndpoint: Google Gemini
          titleModel: gemini-flash-lite-latest
          titleMethod: completion
          models:
            default:
              - mistral-small-latest
              - mistral-medium-latest
              - mistral-large-latest
              - devstral-small-latest
              - devstral-medium-latest
              - devstral-latest
              - codestral-latest
            fetch: false

        - name: OSS Models
          apiKey: user_provided
          baseURL: http://litellm.litellm:4000/v1
          iconURL: https://raw.githubusercontent.com/BerriAI/litellm-docs/main/img/favicon.png
          titleConvo: true
          titleEndpoint: Google Gemini
          titleModel: gemini-flash-lite-latest
          titleMethod: completion
          models:
            default:
              - gemma4
              - qwen3.5
            fetch: false
