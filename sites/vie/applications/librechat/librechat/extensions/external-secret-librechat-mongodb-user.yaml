---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongodb-user
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-auth
  target:
    name: librechat-mongodb-user
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        # the operator's own auto-generated *-conn-str secret requires TLS,
        # and neither app trusts the operator's self-signed internal CA -
        # explicitly disable TLS here rather than relying on default behavior
        uri: "mongodb://librechat:{{ .password }}@librechat-mongodb-rs0:27017/librechat?replicaSet=rs0&authSource=librechat&tls=false"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: librechat-mongodb-user
        property: password
