---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-rag-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-auth
  target:
    name: librechat-rag-secrets
  data:
    - secretKey: RAG_OPENAI_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: librechat-apis
        property: litellm
    - secretKey: JWT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: librechat-oidc
        property: jwt_secret
