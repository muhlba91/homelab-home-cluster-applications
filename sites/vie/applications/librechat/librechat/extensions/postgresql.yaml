---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: librechat-postgresql
  annotations:
    # guardrail: removing this from Git orphans it instead of deleting its data
    kustomize.toolkit.fluxcd.io/prune: disabled
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1

  # renovate: datasource=docker packageName=ghcr.io/muhlba91/postgresql-pgvecto versioning=regex:^.+?-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
  imageName: ghcr.io/muhlba91/postgresql-pgvecto:18.6-0.5.3-v7.1.19

  storage:
    size: 20Gi
    storageClass: ${DEFAULT_STORAGE_CLASS}

  stopDelay: 300
  smartShutdownTimeout: 60

  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 1024Mi

  enableSuperuserAccess: true
  managed:
    roles:
      - name: librechat
        ensure: present
        comment: LibreChat
        login: true
        superuser: true
        passwordSecret:
          name: librechat-database

  bootstrap:
    # initdb:
    #   database: librechat-rag
    #   owner: librechat
    #   encoding: UTF8
    #   secret:
    #     name: librechat-database
    recovery:
      source: librechat-postgresql-backup
      database: librechat-rag
      owner: librechat
      secret:
        name: librechat-database

  postgresql:
    shared_preload_libraries:
      - vchord.so

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: librechat-postgresql-scaleway
        serverName: postgresql

  externalClusters:
    - name: librechat-postgresql-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: librechat-postgresql-scaleway
          serverName: postgresql
