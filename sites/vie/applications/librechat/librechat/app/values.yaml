---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-5.0.0/charts/library/common/values.schema.json
global:
  alwaysAppendIdentifierToResourceName: true

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      librechat:
        image:
          repository: ghcr.io/danny-avila/librechat
          pullPolicy: IfNotPresent
          tag: v0.8.8-rc2

        envFrom:
          - configMapRef:
              name: librechat-env
          - secretRef:
              name: librechat-secrets
          - secretRef:
              name: librechat-meilisearch-master-key

        env:
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: librechat-mongodb-user
                key: uri

        resources:
          requests:
            cpu: 10m
            memory: 513Mi
          limits:
            memory: 768Mi

        probes: &probes
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5

  rag-api:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      api:
        image:
          repository: ghcr.io/danny-avila/librechat-rag-api-dev-lite
          pullPolicy: IfNotPresent
          tag: v0.9.0

        envFrom:
          - configMapRef:
              name: librechat-rag-env
          - secretRef:
              name: librechat-rag-secrets

        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: librechat-database
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: librechat-database
                key: password

        resources:
          requests:
            cpu: 3m
            memory: 207Mi
          limits:
            memory: 207Mi

        probes: *probes

service:
  librechat:
    controller: main
    annotations:
      gatus.home-operations.com/enabled: "true"
    # ipFamilyPolicy: PreferDualStack
    ports:
      http:
        port: 3080
  rag-api:
    controller: rag-api
    # ipFamilyPolicy: PreferDualStack
    ports:
      http:
        port: 8000

route:
  librechat:
    enabled: true
    kind: HTTPRoute
    annotations:
      external-dns.kubernetes.io/provider: public
      external-dns.kubernetes.io/target: "${PUBLIC_IP}"
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: ListenerSet
        namespace: ${APPLICATION_NAMESPACE}
        name: librechat-listeners
    hostnames:
      - &domain chat.ai.${HOME_DOMAIN}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: librechat
            port: 3080
rawResources:
  listeners:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: ListenerSet
      metadata:
        annotations:
          cert-manager.io/cluster-issuer: "${PUBLIC_CLUSTER_ISSUER}"
      spec:
        parentRef:
          name: kgateway-gateway
          namespace: kgateway
        listeners:
          - name: https-librechat
            protocol: HTTPS
            port: 443
            hostname: *domain
            tls:
              mode: Terminate
              certificateRefs:
                - name: librechat-tls-cert
  trafficPolicy:
    manifest:
      apiVersion: gateway.kgateway.dev/v1alpha1
      kind: TrafficPolicy
      metadata:
        name: librechat-timeouts
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: librechat
        timeouts:
          request: 3600s
          streamIdle: 3600s

persistence:
  # scratch only: files are stored in S3 (fileStrategy: s3)
  images:
    enabled: true
    type: emptyDir
    sizeLimit: 1Gi
    advancedMounts:
      main:
        librechat:
          - path: /app/client/public/images
  # scratch only (multer temp + RAG_UPLOAD_DIR)
  uploads:
    enabled: true
    type: emptyDir
    sizeLimit: 1Gi
    advancedMounts:
      main:
        librechat:
          - path: /app/uploads
      rag-api:
        api:
          - path: /app/uploads
  config:
    enabled: true
    type: configMap
    name: librechat-config
    defaultMode: 511
    advancedMounts:
      main:
        librechat:
          - path: /app/librechat.yaml
            subPath: librechat.yaml
