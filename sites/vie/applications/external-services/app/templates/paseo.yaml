---
apiVersion: v1
kind: Service
metadata:
  name: paseo
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: paseo-ipv4
  labels:
    kubernetes.io/service-name: paseo
    endpointslice.kubernetes.io/managed-by: external-services
addressType: IPv4
ports:
  - name: http
    port: 6767
    protocol: TCP
endpoints:
  - addresses:
      - 10.100.60.1
    conditions:
      ready: true

---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: paseo-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${PUBLIC_CLUSTER_ISSUER}"
    external-dns.kubernetes.io/provider: public
spec:
  parentRef:
    name: kgateway-gateway
    namespace: kgateway
  listeners:
    - name: https-paseo
      protocol: HTTPS
      port: 443
      hostname: paseo.dev.${HOME_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: paseo-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo
  annotations:
    external-dns.kubernetes.io/provider: public
    external-dns.kubernetes.io/target: "${PUBLIC_IP}"
spec:
  parentRefs:
    - name: paseo-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - paseo.dev.${HOME_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paseo
          port: 80

---
# Agent output and terminals are long-lived websockets: no route timeout.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: paseo-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: paseo
  timeouts:
    request: 0s
    streamIdle: 3600s
