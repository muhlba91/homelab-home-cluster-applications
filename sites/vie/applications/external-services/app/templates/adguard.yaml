---
apiVersion: v1
kind: Service
metadata:
  name: adguard
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard-ipv4
  labels:
    kubernetes.io/service-name: adguard
    endpointslice.kubernetes.io/managed-by: external-services
addressType: IPv4
ports:
  - name: http
    port: 3000
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.0.1
    conditions:
      ready: true

---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: adguard-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${INTERNAL_CLUSTER_ISSUER}"
    external-dns.kubernetes.io/provider: internal
spec:
  parentRef:
    name: kgateway-gateway-internal
    namespace: kgateway
  listeners:
    - name: https-adguard
      protocol: HTTPS
      port: 443
      hostname: adguard.${LOCAL_INTERNAL_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: adguard-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  annotations:
    external-dns.kubernetes.io/hostname: &domain adguard.${LOCAL_INTERNAL_DOMAIN}
    external-dns.kubernetes.io/provider: internal
spec:
  parentRefs:
    - name: adguard-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - *domain
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adguard
          port: 80
