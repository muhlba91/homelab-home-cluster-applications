---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: litellm-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${INTERNAL_CLUSTER_ISSUER}"
spec:
  parentRef:
    name: kgateway-gateway-internal
    namespace: kgateway
  listeners:
    - name: https-litellm
      protocol: HTTPS
      port: 443
      hostname: proxy.ai.${LOCAL_INTERNAL_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: litellm-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  annotations:
    external-dns.kubernetes.io/provider: internal
    gatus.home-operations.com/enabled: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: LLM Proxy
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: sh-litellm
    gethomepage.dev/description: Unified API gateway for language models
    # hardcoded: Flux substitution of numeric values into raw manifests loses
    # YAML string quoting during the kustomize build step, breaking typed-patch
    # apply (annotations must stay strings) - keep in sync with
    # LANDING_PAGE_INTERNAL_WEIGHT in cluster-configuration.yaml
    gethomepage.dev/weight: "100"
spec:
  parentRefs:
    - name: litellm-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - proxy.ai.${LOCAL_INTERNAL_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
