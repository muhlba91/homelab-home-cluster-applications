---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: litellm-listeners
  annotations:
    cert-manager.io/cluster-issuer: "${PUBLIC_CLUSTER_ISSUER}"
    external-dns.kubernetes.io/provider: public
spec:
  parentRef:
    name: kgateway-gateway-internal
    namespace: kgateway
  listeners:
    - name: https-litellm
      protocol: HTTPS
      port: 443
      hostname: proxy.ai.${HOME_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: litellm-tls-cert

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  annotations:
    external-dns.kubernetes.io/provider: public
    external-dns.kubernetes.io/target: "${PUBLIC_IP}"
spec:
  parentRefs:
    - name: litellm-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - proxy.ai.${HOME_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000

---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: litellm-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: litellm
  timeouts:
    request: 3600s
    streamIdle: 3600s
