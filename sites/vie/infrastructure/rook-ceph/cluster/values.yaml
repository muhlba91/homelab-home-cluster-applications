---
toolbox:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 44Mi
    limits:
      memory: 256Mi

cephImage:
  repository: quay.io/ceph/ceph
  tag: v20.2.4
  allowUnsupported: false

cephClusterSpec:
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  cleanupPolicy:
    confirmation: "" # "yes-really-destroy-data"
  disruptionManagement:
    managePodBudgets: false
  security:
    cephx:
      allowedCiphers:
        - aes256k
      csi:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keepPriorKeyCountMax: 0
        keyType: aes256k
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k
      rbdMirrorPeer:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k
  cephConfig:
    global:
      osd_pool_default_size: "3"
      osd_pool_default_min_size: "2"
      mon_warn_on_pool_no_redundancy: "false"
      bdev_flock_retry: "20"
      bluefs_buffered_io: "false"
      mon_data_avail_warn: "10"
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
    modules:
      - name: pg_autoscaler
        enabled: true
      - name: rook
        enabled: false
  dashboard:
    enabled: true
    ssl: false
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sd[a-c]"
  priorityClassNames:
    all: system-node-critical
  resources:
    mgr:
      requests:
        cpu: 32m
        memory: 491Mi
      limits:
        memory: 1024Mi
    mon:
      requests:
        cpu: 32m
        memory: 513Mi
      limits:
        memory: 1024Mi
    osd:
      requests:
        cpu: 84m
        memory: 2486Mi
      limits:
        memory: 4096Mi
    # prepareosd: # not set
    # mgr-sidecar: # not set
    crashcollector:
      requests:
        cpu: 3m
        memory: 27Mi
      limits:
        memory: 64Mi
    logcollector:
      requests:
        cpu: 3m
        memory: 8Mi
      limits:
        memory: 16Mi
    # cleanup # not set
    exporter:
      requests:
        cpu: 13m
        memory: 25Mi
      limits:
        memory: 64Mi

cephBlockPools:
  - name: builtin-mgr
    spec:
      name: .mgr
      failureDomain: osd
      replicated:
        size: 3
        requireSafeReplicaSize: false
      parameters:
        compression_mode: none
      mirroring:
        enabled: false
    storageClass:
      enabled: false
cephECBlockPools:
  - name: ceph-ec-pool
    spec:
      metadataPool:
        failureDomain: osd
        replicated:
          size: 3
          requireSafeReplicaSize: false
      dataPool:
        failureDomain: osd
        erasureCoded:
          dataChunks: 2
          codingChunks: 1
        parameters:
          allow_ec_optimizations: "true"
    parameters:
      clusterID: rook-ceph
      imageFormat: "2"
      imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
    storageClass:
      enabled: true
      provisioner: rook-ceph.rbd.csi.ceph.com
      name: rook-ceph-block
      isDefault: true
      allowVolumeExpansion: true
      reclaimPolicy: Delete

cephFileSystems: []

cephObjectStores: []
