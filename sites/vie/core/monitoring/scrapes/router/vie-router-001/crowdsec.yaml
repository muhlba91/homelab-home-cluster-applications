---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: vie-router-001-crowdsec
spec:
  jobName: router-crowdsec
  targetEndpoints:
    - targets:
        - 10.0.0.1:6060
      path: /metrics
      interval: 5m
      scrapeTimeout: 30s
      labels:
        instance: vie-router-001
        role: router
        site: vie
